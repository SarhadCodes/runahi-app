name: rounahi
description: رووناهى — Kurdish Quran knowledge and learning platform.
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  shared_preferences: ^2.5.3
  path_provider: ^2.1.6
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  cached_network_image: ^3.4.1
  flutter_local_notifications: ^18.0.1
  home_widget: ^0.7.0+1
  workmanager: ^0.9.0
  flutter_background_service: ^5.1.0
  connectivity_plus: ^6.1.3
  flutter_svg: ^2.1.0
  video_player: ^2.9.5
  just_audio: ^0.9.46
  audio_session: ^0.1.25
  collection: ^1.19.1
  equatable: ^2.0.7
  uuid: ^4.5.1
  intl: any
  permission_handler: ^11.4.0
  timezone: ^0.10.0
  imanikurd: ^1.1.1
  geolocator: ^13.0.4
  flutter_compass: ^0.8.1
  supabase_flutter: ^2.9.1
  youtube_player_iframe: ^6.0.2
  better_player_plus: 1.1.5
  pdfrx: ^2.2.24
  http: ^1.6.0
  wakelock_plus: ^1.2.8
  page_flip: ^0.2.5+1
  just_audio_background: ^0.0.1-beta.17
  audioplayers: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/config/app_config.json
    - assets/config/supabase.json
    - assets/images/
    - assets/images/home_background.jpg
    - assets/images/flower_nav.png
    - assets/images/app_logo.jpg
    - assets/images/app_logo_adaptive.png
    - assets/images/tv_background.jpg
    - assets/images/quran_page.png
    - assets/images/quran page.png
    - assets/images/whatsapp_logo.png
    - assets/images/vector-whatsapp-social-media-logo_1093524-447.avif
    - assets/sound/paper_book.mp3
  fonts:
    - family: Rudaw
      fonts:
        - asset: assets/fonts/Rudaw-Bold.ttf
          weight: 400
        - asset: assets/fonts/Rudaw-Bold.ttf
          weight: 500
        - asset: assets/fonts/Rudaw-Bold.ttf
          weight: 600
        - asset: assets/fonts/Rudaw-Bold.ttf
          weight: 700
    # Real Roboto (from Flutter material_fonts) — Latin glyphs for CMS titles on web.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: Noto Sans Arabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoNaskhArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoNaskhArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
          weight: 400
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_logo.jpg
  image_path_android: assets/images/app_logo_adaptive.png
  min_sdk_android: 21
  adaptive_icon_background: "#0B2A4A"
  adaptive_icon_foreground: assets/images/app_logo_adaptive.png
  adaptive_icon_foreground_inset: 0
  web:
    generate: true
    image_path: assets/images/app_logo.jpg
    background_color: "#0B2A4A"
    theme_color: "#0B2A4A"
