name: "رووناهى — iOS IPA ✓ theme"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag (e.g. rounahi-ios-v1.0.0)"
        required: false
        default: "rounahi-ios-v1.0.0"

jobs:
  build-rounahi-ios:
    name: "Build رووناهى iOS IPA ✓ theme"
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write

    env:
      APP_LABEL: Rounahi
      IPA_NAME: Rounahi-iOS-1.0.0+2-unsigned.ipa
      ARTIFACT_NAME: Rounahi-iOS-1.0.0+2-unsigned

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Flutter doctor
        run: |
          flutter --version
          flutter doctor -v

      - name: Pub get
        run: flutter pub get

      - name: Precache iOS artifacts
        run: flutter precache --ios

      - name: Show iOS deployment settings
        run: |
          echo "=== Building: رووناهى (com.rounahi.rounahi) ==="
          echo "=== Podfile platform ==="
          grep -n "platform :ios" ios/Podfile || true
          echo "=== Flutter.podspec (if present) ==="
          if [ -f ios/Flutter/Flutter.podspec ]; then
            grep -n "deployment_target\|platform" ios/Flutter/Flutter.podspec || true
            cat ios/Flutter/Flutter.podspec
          else
            echo "Flutter.podspec not generated yet (ok before build)"
          fi
          echo "=== Generated.xcconfig ==="
          cat ios/Flutter/Generated.xcconfig || true

      - name: Build iOS (unsigned)
        run: |
          set -euo pipefail
          rm -rf ios/Pods ios/Podfile.lock ios/.symlinks build/ios_derived

          # Config only — avoids Flutter's Development Team preflight that still
          # rejects --no-codesign on current stable when no Apple team is set.
          flutter build ios --config-only --release --no-codesign --no-tree-shake-icons

          cd ios
          pod install --repo-update
          cd ..

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios_derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            build

          APP_SRC="build/ios_derived/Build/Products/Release-iphoneos/Runner.app"
          if [ ! -d "$APP_SRC" ]; then
            echo "Runner.app missing at $APP_SRC"
            find build/ios_derived -type d -name "*.app" -print || true
            exit 1
          fi
          mkdir -p build/ios/iphoneos
          rm -rf build/ios/iphoneos/Runner.app
          cp -R "$APP_SRC" build/ios/iphoneos/Runner.app
          echo "Unsigned Runner.app ready at build/ios/iphoneos/Runner.app"

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Runner.app not found. Listing build/ios:"
            find build/ios -maxdepth 5 -type d -name "*.app" -print || true
            exit 1
          fi
          echo "Packaging رووناهى IPA from: $APP_PATH"
          STAGE="$(mktemp -d)"
          mkdir -p "$STAGE/Payload"
          cp -R "$APP_PATH" "$STAGE/Payload/"
          (
            cd "$STAGE"
            zip -qry "$GITHUB_WORKSPACE/${IPA_NAME}" Payload
          )
          ls -lh "${IPA_NAME}"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-run${{ github.run_number }}
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: "رووناهى iOS ${{ github.event.inputs.release_tag }} (unsigned)"
          body: |
            ## رووناهى — iOS IPA (unsigned)
            - App: **رووناهى**
            - Bundle ID: `com.rounahi.rounahi`
            - Version: `1.0.0+2`
            - File: `Rounahi-iOS-1.0.0+2-unsigned.ipa`
            - Flutter: `3.47.5` + `pdfrx` 2.6.x (fixes CI null-safety build break)
            - Built with: `xcodebuild` unsigned (`CODE_SIGNING_ALLOWED=NO`) after `flutter build ios --config-only --no-codesign`

            Install only via sideload tools that accept unsigned packages.
          files: ${{ env.IPA_NAME }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
